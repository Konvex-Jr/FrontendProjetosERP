server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # O mime.types do nginx:alpine não conhece .webmanifest.
    types {
        application/manifest+json webmanifest;
    }
    include /etc/nginx/mime.types;

    # Cabeçalhos de segurança (auditoria de 13/11/2026). O nginx não herda add_header de cima quando
    # o location tem o seu, então o snippet é repetido nos locations com add_header.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Arquivos com hash no nome (o Vite troca o hash a cada versão): cache de 1 ano.
    location ~* "^/assets/.+-[A-Za-z0-9_-]{8}\.(js|css|woff2)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Imagens e ícones sem hash: 7 dias.
    location ~* \.(webp|png|ico|webmanifest)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Um arquivo de /assets/ que não existe é erro, não a página do app.
    location /assets/ {
        try_files $uri =404;
    }

    location = /robots.txt {
        try_files $uri =404;
    }

    # O index.html aponta para os arquivos da versão atual: sempre revalidar.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}

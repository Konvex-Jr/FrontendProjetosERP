name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: /api
      - name: Orçamento de tamanho
        run: npm run orcamento
